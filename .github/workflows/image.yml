# On every push to master (and by hand): release-please, then the run image published to
# ghcr.io/mcurcio/ear (docs/design/batch2.md section 7).
#
# - release-please (release-please-config.json, .release-please-manifest.json) keeps a release
#   pull request open from master's Conventional Commits; merging it makes the release, its
#   v<version> tag and the version in CMakeLists.txt (the x-release-please-version line).
# - publish builds docker/Dockerfile's run target and pushes it tagged master and
#   sha-<short commit>, plus one tag per v* tag on the built commit (scripts/version-tags.sh).
#   The versions come from git, not from "release created": a release made with GITHUB_TOKEN
#   starts no other workflow, so the versioned push must happen here, and a rerun of a failed
#   publish still finds the tag release-please made the first time.
#
# Runs are never cancelled (a cancelled publish could leave a release without its image); a
# new push waits for the running one.
name: image

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      # Full history and tags, so the tag release-please made on this commit is here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: versions
        name: Version tags on this commit
        run: |
          {
            echo 'tags<<EOF'
            scripts/version-tags.sh
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Report the release
        env:
          RELEASE_CREATED: ${{ needs.release-please.outputs.release_created }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          VERSION_TAGS: ${{ steps.versions.outputs.tags }}
        run: |
          {
            echo "release made by this run: ${RELEASE_CREATED:-false} ${TAG_NAME}"
            echo "version tags pushed: ${VERSION_TAGS:-none}"
          } >> "$GITHUB_STEP_SUMMARY"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/mcurcio/ear
          tags: |
            type=raw,value=master,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,prefix=sha-

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only until the Talos nodes' CPU is known. The layer cache scope is test.yml's image
      # job's, whose push run on master builds the same commit.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: run
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ steps.versions.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
