# Runs the integration tests (make test: builds ear_tests and runs ctest on the virtual audio
# device, no OS audio) and builds the ear binary (make debug) on every pull request, and on
# pushes to master so master's dependency cache is warm for pull requests.
name: test

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Apple Silicon and AppleClang: the only platform EAR is tested on.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner image ships a CMake newer than the 4.2 that cmake_minimum_required and
      # AGENTS.md name; use the tested release.
      - uses: jwlawson/actions-setup-cmake@0d6a7d60b009d01c9e7523be22153ff8f19460d3 # v2.2.0
        with:
          cmake-version: '4.2.1'

      # The fetched JUCE and Boost trees (kept_fetchcontent, cmake/KeptFetchContent.cmake).
      # Each tree's marker records its pin, so a tree restored from an older key is fetched
      # again by configure. The extracted Boost tree is cached rather than its archive
      # (.cache/deps/boost-tmp, unused once the marker matches): about the same compressed size,
      # and it skips the 30-40 s xz extraction.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/deps/juce-src
            .cache/deps/boost-src
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('CMakeLists.txt', 'cmake/KeptFetchContent.cmake') }}
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-

      - run: make test

      # Compiles and links the ear binary itself (src/main.cpp), which make test does not build.
      - run: make debug

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctest-output
          path: out/Testing
          if-no-files-found: ignore
