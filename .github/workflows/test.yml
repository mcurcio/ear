# On every pull request and on pushes to master (so master's caches are warm for pull
# requests): builds EAR's build image (docker/Dockerfile) and, inside it, builds everything and
# runs every test (make test), the same way scripts/dev.sh does on a developer's machine.
name: test

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # EAR builds on Linux only, in its image; the runner only hosts Docker.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image, built with buildx and its layers cached in GitHub's cache (type=gha), so an
      # unchanged Dockerfile restores it instead of reinstalling the packages. load: true puts
      # it in the runner's Docker as ear-dev, which scripts/dev.sh runs (EAR_DEV_IMAGE below).
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          tags: ear-dev
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The fetched Boost tree (kept_fetchcontent, cmake/KeptFetchContent.cmake). Its marker
      # records its pin, so a tree restored from an older key is fetched again by configure.
      # The extracted tree is cached rather than its archive (.cache/deps/boost-tmp, unused once
      # the marker matches): about the same compressed size, and it skips the 30-40 s xz
      # extraction.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/deps/boost-src
          key: >-
            deps-${{ runner.os }}-${{ runner.arch }}-${{
            hashFiles('CMakeLists.txt', 'cmake/KeptFetchContent.cmake') }}
          restore-keys: deps-${{ runner.os }}-${{ runner.arch }}-

      # Compiler output: ccache (the image's compiler launcher), in .cache/ccache, where
      # scripts/dev.sh points CCACHE_DIR. Keyed by content hash, so it is safe with checkout's
      # fresh mtimes (a cached out/ is not). A cache entry cannot be overwritten, so each run
      # saves under its own key and restores the newest; max_size bounds what is saved.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/ccache
          key: ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: ccache-${{ runner.os }}-${{ runner.arch }}-
      - run: mkdir -p .cache/ccache && echo 'max_size = 200M' > .cache/ccache/ccache.conf

      # Builds ear and every test executable, then runs ctest; ctest's ear_help test starts the
      # built binary, so this also checks it loads its shared libraries.
      - run: scripts/dev.sh make test
        env:
          EAR_DEV_IMAGE: ear-dev

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ctest-output
          path: out/Testing
          if-no-files-found: ignore
