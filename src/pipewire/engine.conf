# EAR's in-process PipeWire engine (src/pipewire/include/ear/pipewire/engine.hpp), read by
# pw_context_new. src/pipewire/tests/engine_test.cpp runs it against PipeWire 1.4.2 (Debian 13).
# Every property set here is a row of src/pipewire/engine_properties.hpp, and why is that row in
# docs/engine.md#properties-ear-sets; engine_properties_test.cpp fails for a key here the table does
# not list, a value it does not hold, or a key it forbids here (docs/engine.md#properties-ear-never-sets:
# default.clock.*, clock.power-of-two-quantum and cpu.zero.denormals).
context.properties = {
    core.daemon            = false   # docs/engine.md#properties-ear-sets
    core.name              = ear     # docs/engine.md#properties-ear-sets
    support.dbus           = false   # docs/engine.md#properties-ear-sets
    context.num-data-loops = 1       # docs/engine.md#properties-ear-sets
}

# docs/engine.md#modules-and-libraries
context.spa-libs = {
    support.*       = support/libspa-support
    api.alsa.*      = alsa/libspa-alsa
    audio.convert.* = audioconvert/libspa-audioconvert
}

# docs/engine.md#modules-and-libraries
context.modules = [
    { name = libpipewire-module-rt flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-spa-node-factory }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-adapter }
]

context.objects = [
    # ear's internal clock (docs/engine.md#the-internal-clock); each argument is an "internal clock"
    # row of docs/engine.md#properties-ear-sets.
    { factory = spa-node-factory
        args = {
            factory.name    = support.node.driver   # docs/engine.md#properties-ear-sets
            node.name       = Dummy-Driver          # docs/engine.md#properties-ear-sets
            priority.driver = 200000                # docs/engine.md#properties-ear-sets
            node.group      = ear.graph             # docs/engine.md#properties-ear-sets
            clock.id        = monotonic-raw         # docs/engine.md#properties-ear-sets
            resync.ms       = 1000000000            # docs/engine.md#properties-ear-sets
        }
    }
]
