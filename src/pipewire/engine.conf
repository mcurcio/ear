# EAR's in-process PipeWire engine (src/pipewire/include/ear/pipewire/engine.hpp), read by
# pw_context_new. src/pipewire/tests/engine_test.cpp runs it against PipeWire 1.4.2 (Debian 13).
# It must not set default.clock.* or clock.power-of-two-quantum: context.properties here
# overwrite the properties Engine passes to pw_context_new, which carry the graph frequency
# and block size.
context.properties = {
    # No socket and no runtime directory: EAR's own connection is the only client in M1.
    core.daemon  = false
    core.name    = ear
    # No D-Bus in the container.
    support.dbus = false
}

context.spa-libs = {
    support.*       = support/libspa-support
    # Sound cards (sound_cards.cpp): the ALSA PCM nodes and the converter the adapter wraps
    # around them (Debian's libspa-0.2-modules holds both).
    api.alsa.*      = alsa/libspa-alsa
    audio.convert.* = audioconvert/libspa-audioconvert
}

context.modules = [
    # Realtime priority for the data thread where the container allows it.
    { name = libpipewire-module-rt flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    # Exports the port blocks' pw_filter nodes.
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-spa-node-factory }
    # Makes the route links (by port global id) and a sound card's own links (by node and
    # port name).
    { name = libpipewire-module-link-factory }
    # Makes a sound card: an ALSA PCM node wrapped in a converter with one port per channel.
    { name = libpipewire-module-adapter }
]

context.objects = [
    # ear's internal clock, the graph's one driver whatever links or fails
    # (docs/design/node-framework.md section 10). It joins the port blocks' group (node.group,
    # engine_names.hpp graphGroup) and keeps the highest priority.driver of every driver (a
    # card's, cardPriority, is 1): PipeWire walks drivers in priority order, so the dummy collects
    # the group and everything linked to it first, and a linked card is a follower. A card still
    # runs alone as its own driver until its PCM runs; that is how it starts. Never mark cards
    # node.driver = false: the ALSA node publishes node.driver = true again.
    # clock.id = monotonic-raw: CLOCK_MONOTONIC is slewed by NTP, and timerfd cannot arm
    # CLOCK_MONOTONIC_RAW, so the driver keeps its timer on CLOCK_MONOTONIC and steers it with a
    # delay-locked loop until clock.position follows raw time (its "tracking" mode; rate_diff is
    # the correction). clock.nsec and next_nsec stay CLOCK_MONOTONIC. Past resync.ms (10 ms) of
    # disagreement, after a stall, the position jumps to raw time. Its clock.name is
    # clock.system.monotonic-raw (engine_names.hpp, internalClockName).
    { factory = spa-node-factory
        args = {
            factory.name    = support.node.driver
            node.name       = Dummy-Driver
            priority.driver = 200000
            node.group      = ear.graph
            clock.id        = monotonic-raw
        }
    }
]
