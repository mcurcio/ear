# EAR's in-process PipeWire engine (src/pipewire/include/ear/pipewire/engine.hpp), read by
# pw_context_new. The first version, from docs/design/m1-white-to-file.md section 2; slice S1
# proves it against the engine. It must not set default.clock.*: context.properties here
# overwrite the properties Engine passes to pw_context_new, which carry the graph frequency
# and block size.
context.properties = {
    # No socket and no runtime directory: EAR's own connection is the only client in M1.
    core.daemon  = false
    core.name    = ear
    # No D-Bus in the container.
    support.dbus = false
}

context.spa-libs = {
    support.* = support/libspa-support
}

context.modules = [
    # Realtime priority for the data thread where the container allows it.
    { name = libpipewire-module-rt flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    # Exports the port blocks' pw_filter nodes.
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-spa-node-factory }
    # Makes the route links (by port global id).
    { name = libpipewire-module-link-factory }
]

context.objects = [
    # The driver that clocks the graph: no sound card in M1.
    { factory = spa-node-factory
        args = {
            factory.name    = support.node.driver
            node.name       = Dummy-Driver
            priority.driver = 200000
        }
    }
]
