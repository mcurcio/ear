# EAR's in-process PipeWire engine (src/pipewire/include/ear/pipewire/engine.hpp), read by
# pw_context_new. src/pipewire/tests/engine_test.cpp runs it against PipeWire 1.4.2 (Debian 13).
# It must not set default.clock.* or clock.power-of-two-quantum: context.properties here
# overwrite the properties Engine passes to pw_context_new, which carry the graph frequency
# and block size.
context.properties = {
    # No socket and no runtime directory: EAR's own connection is the only client in M1.
    core.daemon  = false
    core.name    = ear
    # No D-Bus in the container.
    support.dbus = false
    # One data loop runs every engine node's process: the port blocks, the sound cards' adapters and the RTP
    # receivers (rtp-source names it in node.loop.name). It is PipeWire 1.4.2's default (context.c,
    # DEFAULT_DATA_LOOPS), pinned here because the node framework relies on it: a block and the engine nodes beside
    # it see one clock.position per cycle, and a non-blocking invoke on that loop runs between any two of their
    # cycles (docs/design/node-lifecycle.md sections 5.3 and 10; src/pipewire/tests/spikes_test.cpp, S3).
    context.num-data-loops = 1
}

context.spa-libs = {
    support.*       = support/libspa-support
    # Sound cards (sound_cards.cpp): the ALSA PCM nodes and the converter the adapter wraps
    # around them (Debian's libspa-0.2-modules holds both).
    api.alsa.*      = alsa/libspa-alsa
    audio.convert.* = audioconvert/libspa-audioconvert
}

context.modules = [
    # Realtime priority for the data thread where the container allows it.
    { name = libpipewire-module-rt flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    # Exports the port blocks' pw_filter nodes.
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-spa-node-factory }
    # Makes the route links (by port global id) and a sound card's own links (by node and
    # port name).
    { name = libpipewire-module-link-factory }
    # Makes a sound card: an ALSA PCM node wrapped in a converter with one port per channel.
    { name = libpipewire-module-adapter }
]

context.objects = [
    # ear's internal clock, the graph's one driver whatever links or fails
    # (docs/design/node-framework.md section 10). It joins the port blocks' group (node.group,
    # engine_names.hpp graphGroup) and keeps the highest priority.driver of every driver (a
    # card's, cardPriority, is 1): PipeWire walks drivers in priority order, so the dummy collects
    # the group and everything linked to it first, and a linked card is a follower. A card still
    # runs alone as its own driver until its PCM runs; that is how it starts. Never mark cards
    # node.driver = false: the ALSA node publishes node.driver = true again.
    # clock.id = monotonic-raw: CLOCK_MONOTONIC is slewed by NTP, and timerfd cannot arm
    # CLOCK_MONOTONIC_RAW, so the driver keeps its timer on CLOCK_MONOTONIC and steers it with a
    # delay-locked loop until clock.position follows raw time (its "tracking" mode; rate_diff is
    # the correction). clock.nsec and next_nsec stay CLOCK_MONOTONIC. Its clock.name is
    # clock.system.monotonic-raw (engine_names.hpp, internalClockName).
    # resync.ms = 1000000000 (about 11 days, beyond any stall): the driver never resets. Past
    # resync.ms (default 10 ms) node-driver.c on_timeout puts clock.position on raw time but leaves
    # its timer where it was, so the timeouts it then fires back to back step the position back at
    # the next reset and leave it up to resync.ms ahead of raw time, where its error is clamped to
    # 1 ms a cycle and its loop slews the graph by hundreds of ppm for tens of seconds (-230 ppm 9 s
    # after one 20 ms stall). Without the reset it catches up on its own timer: the cycles the
    # blocks run during the catch-up each skip one block, and after stalls of up to a few seconds
    # the position never steps back and keeps its phase to the raw clock. PipeWire's non-tracking
    # driver never resets either. The limit: the catch-up burst after any pause is inherent to
    # node-driver.c whatever resync.ms is (about 187 timeouts a second of pause at 48000/256, about
    # half of them run), and each feeds the loop its clamped 1 ms error, so a pause of tens of
    # seconds or more winds it up and slews the graph by 0.1 to 0.6 % for minutes (simulated: 30 s,
    # +287/-429 ppm for about 60 s; 120 s, 1700 ppm at peak and about 146 ms ahead, for minutes).
    # The default 10 ms is somewhat better only for pauses of minutes, and a large finite value is
    # worse than either (it resets mid-burst and steps back again and again). The fix belongs
    # upstream: a reset that re-arms next_time from now and re-initialises the loop
    # (spa_dll_init). The tests "After data-thread stalls past 10 ms ..." and "After a 3 s
    # data-thread stall ..." (port_block_test.cpp) pin it.
    { factory = spa-node-factory
        args = {
            factory.name    = support.node.driver
            node.name       = Dummy-Driver
            priority.driver = 200000
            node.group      = ear.graph
            clock.id        = monotonic-raw
            resync.ms       = 1000000000
        }
    }
]
