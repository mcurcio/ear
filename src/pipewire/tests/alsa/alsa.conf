# A test ALSA configuration for the sound card tests (docs/design/batch2.md section 5, slice
# E2). sound_card_test.cpp points ALSA_CONFIG_PATH at this file, so it replaces alsa-lib's own
# alsa.conf in the test process. It defines "hw", the way EAR names a card
# ("hw:CARD=<id>,DEV=0", sound_cards.cpp), as the PCM "card_<id>". Only card "Test" exists:
# alsa-lib's file PCM over its null PCM, so what the card is sent lands in
# $EAR_ALSA_OUT/card.raw (32-bit float, interleaved) and the null PCM throws it away. Any other
# card id names a PCM that is not defined, so it cannot open, as a card that is not there.

pcm.hw {
	@args [ CARD DEV SUBDEV ]
	@args.CARD { type string }
	@args.DEV { type integer default 0 }
	@args.SUBDEV { type integer default -1 }
	type plug
	slave.pcm {
		@func concat
		strings [ "card_" $CARD ]
	}
}

# The plug in hw fixes the samples at 32-bit float. The null PCM alone takes every format, DSD
# included, which PipeWire's ALSA node would then offer too.
pcm.card_Test {
	type plug
	slave {
		format FLOAT_LE
		pcm {
			type file
			slave.pcm "null"
			format "raw"
			file {
				@func concat
				strings [ { @func getenv vars [ EAR_ALSA_OUT ] default "/nonexistent" } "/card.raw" ]
			}
		}
	}
}

pcm.null {
	type null
}
